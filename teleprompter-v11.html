<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LiveVoz V14 Stage Director</title>
<style>
html,body,#livevoz-app{width:100%;height:100%;margin:0;border:0;background:#050505;overflow:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#050505;color:#ddd;font:600 14px system-ui;z-index:2}
</style>
</head>
<body>
<div id="boot">Cargando LiveVoz V14 Stage Director…</div>
<iframe id="livevoz-app" title="LiveVoz Teleprompter"></iframe>
<script>
(() => {
  const frame=document.getElementById('livevoz-app');
  frame.src='./teleprompter.html'+location.search;
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      const loadScript=(src,onload)=>{const s=doc.createElement('script');s.src=src;s.onload=onload;s.onerror=onload;doc.body.appendChild(s);};
      const loadRuntime=()=>loadScript('./livevoz-v11-runtime.js',()=>loadScript('./livevoz-v13-bridge.js',()=>loadScript('./livevoz-v13-2-sync.js',()=>loadScript('./livevoz-v14-runtime.js',()=>loadScript('./livevoz-v14-cloud.js',()=>document.getElementById('boot')?.remove())))));
      const sdk=doc.createElement('script');
      sdk.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      sdk.onload=loadRuntime;sdk.onerror=loadRuntime;doc.head.appendChild(sdk);
    }catch(error){console.error(error);document.getElementById('boot').textContent='No se pudo iniciar LiveVoz V14';}
  });
})();
</script>
</body>
</html>
