name: LiveVoz Quality

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Smoke test Stage Network
        run: |
          npm run stage-server > stage-network.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          npm run stage-health
          kill $SERVER_PID
