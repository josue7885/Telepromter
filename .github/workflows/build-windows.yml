name: Build LiveVoz Windows

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama o tag de LiveVoz que se compilara"
        required: true
        default: "release/livevoz-v15.0.0"
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build LiveVoz Windows
    runs-on: windows-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify LiveVoz
        run: npm run check
      - name: Build Windows executables
        run: npm run dist:win
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: LiveVoz-Windows-15.0.0
          if-no-files-found: error
          retention-days: 30
          path: |
            release/LiveVoz Teleprompter Setup 15.0.0.exe
            release/LiveVoz Teleprompter 15.0.0.exe
            release/*.blockmap
